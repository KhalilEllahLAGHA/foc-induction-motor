<g>
  <text class="heading" x="106" y="84">Speed PI</text><text class="detail" x="106" y="107">Speed error → torque</text>
  <text class="heading" x="301" y="84">Torque to i<tspan baseline-shift="sub" font-size="12">q</tspan><tspan>*</tspan></text><text class="detail" x="301" y="107">Uses estimated flux</text>
  <text class="heading" x="498" y="84">d and q current PIs</text><text class="detail" x="498" y="107">Voltage + feed-forward</text>
  <text class="heading" x="680" y="84">Inverse Park</text><text class="detail" x="680" y="107">dq → αβ</text>
