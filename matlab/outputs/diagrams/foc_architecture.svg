<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" role="img" aria-labelledby="title">
<title id="title">Indirect field-oriented control signal flow</title>
<defs>
  <marker id="command" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#235c95"/></marker>
  <marker id="feedback" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#146756"/></marker>
  <marker id="estimate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#9d4517"/></marker>
  <style>
    text {font-family:Segoe UI,Arial,sans-serif;fill:#17304a}
    .node {fill:#eef5fc;stroke:#b2cbe3;stroke-width:1.3}
    .measure {fill:#e8f5f1;stroke:#9ecabe}
    .observer {fill:#fdf2e8;stroke:#e2b89d}
    .heading {font-size:17px;font-weight:700;text-anchor:middle}
    .detail {font-size:14px;text-anchor:middle}
    .label {font-size:15px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:4px}
    .command,.feedback,.estimate {fill:none;stroke-width:2;stroke-linejoin:round}
    .command {stroke:#235c95;marker-end:url(#command)}
    .feedback {stroke:#146756;marker-end:url(#feedback)}
    .estimate {stroke:#9d4517;marker-end:url(#estimate)}
  </style>
</defs>
<rect width="1120" height="480" fill="#fff"/>
<text x="22" y="30" font-size="16" font-weight="700">COMMAND PATH</text>
<text x="22" y="169" font-size="16" font-weight="700">FEEDBACK AND FIELD ORIENTATION</text>
